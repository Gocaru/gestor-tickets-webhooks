name: Node.js CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server-main/package-lock.json

      - name: Instalar dependências
        working-directory: ./server-main
        run: npm ci

      - name: Correr testes
        working-directory: ./server-main
        run: npm test
